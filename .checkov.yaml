framework:
  - terraform
  - github_actions
compact: true
quiet: true
skip-path:
  - .terraform
# Each skip is a documented, deliberate trade-off for a low-cost lab. See docs/checkov-exceptions.md.
skip-check:
  - CKV_AWS_144   # S3 cross-region replication: not worth the cost for a lab audit bucket
  - CKV_AWS_18    # S3 access logging on the log bucket itself would recurse; CloudTrail data events cover it
  - CKV2_AWS_62   # S3 event notifications: not needed for an audit bucket
  - CKV_AWS_28    # DynamoDB backup plan: PITR is enabled, lock table holds no data
  - CKV_GHA_7     # destroy workflow needs a typed confirmation input on purpose
  - CKV_AWS_119   # DynamoDB CMK: covered, check misfires on kms_key_arn reference
